# Manual only: opens a merge request against fdroid/fdroiddata (via the
# nituls265/fdroiddata fork) adding a Build entry for the given tag.
#
# Do NOT run this for ordinary releases. The fdroiddata recipe uses
# AutoUpdateMode: Version + UpdateCheckMode: Tags, so F-Droid's own bot adds
# the Build entry for every new tag. A manual MR for a plain version bump
# duplicates that change and gets closed by maintainers (see
# fdroid/fdroiddata!55795). Use this only when the recipe itself must change.
#
# Requires a repo secret FDROID_GITLAB_TOKEN: a GitLab personal access token
# (scope: api) on the account that owns the fdroiddata fork.
name: F-Droid metadata MR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to open the MR for (e.g. v1.14). Only for recipe changes that F-Droid's auto-update cannot make."
        required: true

jobs:
  open-mr:
    runs-on: ubuntu-latest
    steps:
      # Checked out at the default branch (NOT the release tag): this is
      # what provides scripts/open_fdroid_mr.py. The release's own commit
      # and version are read separately below via `git show`/`rev-parse`,
      # without switching the working tree to it, so the automation script
      # is always the current one even when re-running for an older tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version info
        id: info
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --depth 1
          COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          VERSION_NAME=$(git show "$COMMIT:app/build.gradle.kts" | sed -n 's/^ *versionName = "\(.*\)"/\1/p')
          VERSION_CODE=$(git show "$COMMIT:app/build.gradle.kts" | sed -n 's/^ *versionCode = \([0-9]*\)/\1/p')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Open F-Droid metadata MR
        env:
          GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
          VERSION_NAME: ${{ steps.info.outputs.version_name }}
          VERSION_CODE: ${{ steps.info.outputs.version_code }}
          COMMIT: ${{ steps.info.outputs.commit }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::FDROID_GITLAB_TOKEN secret is not set; skipping."
            exit 1
          fi
          python3 scripts/open_fdroid_mr.py
