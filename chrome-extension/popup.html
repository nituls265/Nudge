<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nudge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #2dd4bf;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Linked state ── */
    #linked-view { display: none; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .stat-label { font-size: 12px; color: #94a3b8; }
    .stat-value { font-size: 24px; font-weight: 700; color: #2dd4bf; }
    .stat-sub   { font-size: 11px; color: #64748b; margin-bottom: 16px; }

    .divider { border: none; border-top: 1px solid #1e293b; margin: 14px 0; }

    .domain-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .domain-name  { color: #94a3b8; }
    .domain-count { color: #e2e8f0; font-weight: 600; }

    .sync-badge {
      margin-top: 14px;
      font-size: 10px;
      color: #475569;
      text-align: center;
    }

    /* ── Setup state ── */
    #setup-view {}

    .instructions {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .instructions strong { color: #e2e8f0; }

    input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 10px;
      font-family: monospace;
      letter-spacing: 1px;
    }
    input:focus { border-color: #2dd4bf; }
    input::placeholder { color: #475569; letter-spacing: 0; }

    button {
      width: 100%;
      background: #2dd4bf;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      padding: 10px;
      cursor: pointer;
    }
    button:hover   { background: #5eead4; }
    button.outline {
      background: transparent;
      color: #64748b;
      border: 1px solid #1e293b;
      font-weight: 400;
      font-size: 12px;
      margin-top: 8px;
    }

    .error { color: #f87171; font-size: 11px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="logo">◎ Nudge</div>

  <!-- ── Linked: show today's counts ── -->
  <div id="linked-view">
    <div class="stat-row">
      <span class="stat-label">Laptop scrolls today</span>
      <span class="stat-value" id="laptop-count">—</span>
    </div>
    <div class="stat-sub" id="last-synced">Syncing…</div>

    <hr class="divider" />

    <div id="domain-breakdown"></div>

    <div class="sync-badge" id="sync-status">●  Waiting for first scroll</div>

    <div class="sync-badge" id="pending-status" style="margin-top:6px;color:#2dd4bf;display:none"></div>

    <hr class="divider" />
    <button id="sync-now-btn" style="margin-bottom:8px;">Sync Now</button>
    <button class="outline" id="unlink-btn">Unlink phone</button>
  </div>

  <!-- ── Setup: paste Sync ID ── -->
  <div id="setup-view">
    <p class="instructions">
      Open <strong>Nudge</strong> on your Android phone,<br />
      go to <strong>Settings → Sync Code</strong>, and paste<br />
      the code below to link your devices.
    </p>
    <input id="sync-id-input" type="text" placeholder="Paste your Sync Code" maxlength="60" />
    <div class="error" id="error-msg" style="display:none"></div>
    <button id="link-btn">Link Phone</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
